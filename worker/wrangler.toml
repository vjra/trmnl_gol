name = "lenia-trmnl"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Only the stable <name>.<subdomain>.workers.dev URL that TRMNL polls; no per-version preview URLs.
workers_dev = true
preview_urls = false

[vars]
# Where GitHub Pages serves site/ (manifest.json + frames/). Set before deploying.
SITE_URL = "https://vjra.github.io/trmnl_gol"
TZ = "Europe/Vienna"
# Device sleeps through these local hours (saves battery). "" disables.
QUIET_HOURS = "23-7"
# Weekdays only (Mon-Fri), reduced update frequency instead of full sleep. "" disables.
WORK_HOURS = "10-17"
WORK_REFRESH = "1800"
