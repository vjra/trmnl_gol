# Daily: render a 24 h frame loop and publish it to GitHub Pages.
# Repo settings -> Pages -> Source: "GitHub Actions" (or: gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow)
name: render

on:
  schedule:
    - cron: "30 2 * * *"          # 02:30 UTC, inside the default quiet hours in Vienna
  workflow_dispatch:
    inputs:
      n:
        description: "frames (1440 = 24 h at 1/min)"
        type: number
        default: 1440
  push:
    branches: [main]
    paths: [lenia_trmnl.py, species.json, .github/workflows/render.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # input goes through env, never straight into the shell script (no expression injection).
      # --keep-previous ships the live build's frames too, so cached old manifests never hit a 404.
      - run: |
          live="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          python lenia_trmnl.py render-day --n "$N" --outdir site --keep-previous "$live"
        env:
          N: ${{ inputs.n || 1440 }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
