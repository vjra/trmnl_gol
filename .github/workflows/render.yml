# Daily: render a 24 h frame loop and publish it to GitHub Pages.
# Repo settings -> Pages -> Source: "GitHub Actions" (or: gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow)
name: render

on:
  schedule:
    - cron: "30 2 * * *"          # 02:30 UTC, inside the default quiet hours in Vienna
  workflow_dispatch:
    inputs:
      n:
        description: "frames (1440 = 24 h at 1/min)"
        default: "1440"
  push:
    branches: [main]
    paths: [lenia_trmnl.py, species.json, .github/workflows/render.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python lenia_trmnl.py render-day --n "${{ inputs.n || 1440 }}" --outdir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
